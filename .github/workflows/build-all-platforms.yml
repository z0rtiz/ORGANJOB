name: Build Cross-Platform (Windows, macOS, Linux)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Build Windows Executable (.exe)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never

      - name: Build macOS Executable (.dmg / .zip)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac dmg zip --universal --publish never

      - name: Build Linux Executable (AppImage / deb)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrganJob-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-binaries
          merge-multiple: true

      - name: Create or Update GitHub Release (Never Expires)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          name: "OrganJob Pro v1.0.0 (Windows, Mac, Linux)"
          body: |
            ## OrganJob Pro v1.0.0 - Descargas Oficiales
            
            Aplicación de escritorio para Windows, macOS y Linux.
            
            ### 📦 Instaladores Disponibles:
            * **Windows**: `OrganJob Setup 1.0.0.exe`
            * **macOS (Universal - Apple Silicon M1/M2/M3/M4 e Intel)**: `OrganJob-1.0.0-universal.dmg` / `.zip`
            * **Linux**: `OrganJob-1.0.0.AppImage` y `organjob_1.0.0_amd64.deb`
            
            *(Enlaces de descarga permanente sin expiración)*.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            all-binaries/*.exe
            all-binaries/*.dmg
            all-binaries/*.zip
            all-binaries/*.AppImage
            all-binaries/*.deb
